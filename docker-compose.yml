# version: '3.8'

services:
  overlay-editor:
    # Pin to linux/amd64 so the container matches fly.io's runtime architecture
    # (its default `cpu_kind = 'shared'` is amd64). The vendored inty-midi
    # binary at vendor/inty-midi/inty-midi is x86-64 ELF, so we need this
    # platform pin on Apple Silicon hosts — otherwise the local container
    # runs as aarch64 and fails to exec the binary with a rosetta error.
    # Compose hands this to BuildKit (== `docker buildx --platform=linux/amd64`).
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
      args:
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
    container_name: intellivision-overlay-editor
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - OVL_HOST=0.0.0.0
      - OVL_PORT=5000
      - OVL_DEBUG=0
    restart: unless-stopped
    # volumes:
      # Optional: Mount a local directory for persistent overlays
      # - ./overlays:/app/overlays
