# fly.toml app configuration file generated for intellivision-overlay-editor on 2026-01-06T11:46:12-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'intellivision-overlay-editor'
primary_region = 'ewr'

[build]

[env]
  OVL_HOST = "0.0.0.0"
  OVL_PORT = "5000"
  OVL_DEBUG = "0"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
