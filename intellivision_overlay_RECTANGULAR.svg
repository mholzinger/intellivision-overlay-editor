<?xml version="1.0" encoding="UTF-8"?>
<svg width="55.6mm" height="90.4mm" viewBox="0 0 55.6 90.4"
     xmlns="http://www.w3.org/2000/svg">

  <title>Intellivision Controller Overlay Template - Rectangular Buttons</title>

  <defs>
    <style>
      .outline { fill: none; stroke: #000000; stroke-width: 0.2; }
      .guide { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.3,0.3; opacity: 0.5; }
      .button { fill: none; stroke: #8B4513; stroke-width: 0.15; opacity: 0.6; }
      .button_center { fill: #8B4513; opacity: 0.4; }
      .label { font-family: Arial, sans-serif; font-size: 2px; fill: #8B4513; }
      .label_small { font-family: Arial, sans-serif; font-size: 1.2px; fill: #666666; }
      .zone { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.4,0.4; opacity: 0.3; }
      .copyright { font-family: Arial Black, sans-serif; font-size: 2px; fill: #333333; }
    </style>
  </defs>

  <!-- Background -->
  <rect id="overlay-background" x="0" y="0" width="55.6" height="90.4" fill="#FFFFFF"/>

  <!-- Outer boundary with different top/bottom rounded corners -->
  <!-- Top corners: 2.26mm radius | Bottom corners: 9.0mm radius -->
  <path id="outer_boundary"
        d="M 2.26 0
           L 53.34 0
           Q 55.6 0 55.6 2.26
           L 55.6 81.4
           Q 55.6 90.4 46.6 90.4
           L 9.0 90.4
           Q 0 90.4 0 81.4
           L 0 2.26
           Q 0 0 2.26 0 Z"
        class="outline"/>

  <!-- TITLE BAR AREA -->
  <rect id="title_bar_zone"
        x="2" y="2"
        width="51.6" height="16"
        class="zone"/>

  <!-- TITLE BACKGROUND (optional colored fill matching official overlays) -->
  <rect id="title-background"
        x="3.5" y="2.4"
        width="48.6" height="11.5"
        rx="1.5" ry="1.5"
        fill="none"
        opacity="1.0"/>

  <!-- TITLE BORDER (rounded rectangle matching official overlays) -->
  <rect id="title-border"
        x="3.5" y="2.4"
        width="48.6" height="11.5"
        rx="1.5" ry="1.5"
        fill="none"
        stroke="#8B4513"
        stroke-width="0.15"
        opacity="0.8"/>

  <text id="title-text" x="27.8" y="8.5" text-anchor="middle" class="label">TITLE SPACE</text>
  <text id="copyright-text" x="27.8" y="19.5" text-anchor="middle" class="copyright">© Copyright Year &amp; Printing Info.</text>

  <!-- ROW DESCRIPTIONS (optional labels above each button row) -->
  <g id="row_descriptions">
    <text id="row-desc-1" x="27.8" y="24.5" text-anchor="middle" class="label_small">Row 1 Description</text>
    <text id="row-desc-2" x="27.8" y="39.5" text-anchor="middle" class="label_small">Row 2 Description</text>
    <text id="row-desc-3" x="27.8" y="54.5" text-anchor="middle" class="label_small">Row 3 Description</text>
    <text id="row-desc-4" x="27.8" y="69.5" text-anchor="middle" class="label_small">Row 4 Description</text>
  </g>

  <!-- KEYPAD BUTTON GRID (3 columns × 4 rows) - RECTANGULAR BUTTONS -->
  <!-- Positioned to match official overlay measurements: centers at (13.30, 27.20, 41.10) x (31.95, 46.93, 61.91, 76.88) -->
  <!-- Adjusted -1.5mm from original; spacing now 14.98mm between rows -->
  <g id="keypad_buttons">
    <!-- Row 1: Buttons 1, 2, 3 - Center Y: 31.95mm (anchored) -->
    <!-- Button 1 -->
    <circle cx="13.30" cy="31.95" r="0.05" class="button_center"/>
    <rect x="7.60" y="26.25" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-1" x="13.80" y="31.95" text-anchor="middle" class="label_small">1</text>

    <!-- Button 2 -->
    <circle cx="27.20" cy="31.95" r="0.05" class="button_center"/>
    <rect x="21.50" y="26.25" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-2" x="27.70" y="31.95" text-anchor="middle" class="label_small">2</text>

    <!-- Button 3 -->
    <circle cx="41.10" cy="31.95" r="0.05" class="button_center"/>
    <rect x="35.40" y="26.25" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-3" x="41.60" y="31.95" text-anchor="middle" class="label_small">3</text>

    <!-- Row 2: Buttons 4, 5, 6 - Center Y: 46.93mm -->
    <!-- Button 4 -->
    <circle cx="13.30" cy="46.93" r="0.05" class="button_center"/>
    <rect x="7.60" y="41.23" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-4" x="13.80" y="46.93" text-anchor="middle" class="label_small">4</text>

    <!-- Button 5 -->
    <circle cx="27.20" cy="46.93" r="0.05" class="button_center"/>
    <rect x="21.50" y="41.23" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-5" x="27.70" y="46.93" text-anchor="middle" class="label_small">5</text>

    <!-- Button 6 -->
    <circle cx="41.10" cy="46.93" r="0.05" class="button_center"/>
    <rect x="35.40" y="41.23" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-6" x="41.60" y="46.93" text-anchor="middle" class="label_small">6</text>

    <!-- Row 3: Buttons 7, 8, 9 - Center Y: 61.91mm -->
    <!-- Button 7 -->
    <circle cx="13.30" cy="61.91" r="0.05" class="button_center"/>
    <rect x="7.60" y="56.21" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-7" x="13.80" y="61.91" text-anchor="middle" class="label_small">7</text>

    <!-- Button 8 -->
    <circle cx="27.20" cy="61.91" r="0.05" class="button_center"/>
    <rect x="21.50" y="56.21" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-8" x="27.70" y="61.91" text-anchor="middle" class="label_small">8</text>

    <!-- Button 9 -->
    <circle cx="41.10" cy="61.91" r="0.05" class="button_center"/>
    <rect x="35.40" y="56.21" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-9" x="41.60" y="61.91" text-anchor="middle" class="label_small">9</text>

    <!-- Row 4: CLEAR, 0, ENTER - Center Y: 76.88mm -->
    <!-- Button CLEAR -->
    <circle cx="13.30" cy="76.88" r="0.05" class="button_center"/>
    <rect x="7.60" y="71.18" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-clear" x="13.80" y="76.88" text-anchor="middle" class="label_small">CLR</text>

    <!-- Button 0 -->
    <circle cx="27.20" cy="76.88" r="0.05" class="button_center"/>
    <rect x="21.50" y="71.18" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-0" x="27.70" y="76.88" text-anchor="middle" class="label_small">0</text>

    <!-- Button ENTER -->
    <circle cx="41.10" cy="76.88" r="0.05" class="button_center"/>
    <rect x="35.40" y="71.18" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-enter" x="41.60" y="76.88" text-anchor="middle" class="label_small">ENT</text>
  </g>

  <!-- Grid information (hidden - development reference only) -->
  <g id="grid_info" display="none">
    <text x="27.8" y="1.5" text-anchor="middle" class="label_small">
      Expanded Layout: 11.4mm buttons | Spacing: 16.8mm (H) × 15mm (V) | Starts at 24.8mm from top
    </text>
  </g>

  <!-- SIDE ACTION BUTTONS -->
  <!-- Left side action buttons (text runs vertically along left edge) -->
  <g id="left_action_buttons">
    <!-- Top Left Action Button (aligned with rows 2-3, Y ~54.5mm) -->
    <g id="top-left-action">
      <polygon id="top-left-arrow" points="5.72,46.89 3.68,48.39 5.72,49.89" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>
      <text id="top-left-label" x="2.82" y="45.06" text-anchor="end"
          transform="rotate(90, 3.65, 46.09)" class="label_small">ACTION</text>
    </g>

    <!-- Bottom Left Action Button (aligned with rows 3-4, Y ~69.6mm) -->
    <g id="bottom-left-action">
      <polygon id="bottom-left-arrow" points="5.82,61.63 3.78,63.13 5.82,64.63" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>
      <text id="bottom-left-label" x="4.4" y="65.33" text-anchor="start"
          transform="rotate(90, 4.0, 66.03)" class="label_small">ACTION</text>
    </g>

    <!-- Left side description (centered vertically between top and bottom action buttons) -->
    <text id="action-desc-left" x="2.0" y="55.0" text-anchor="middle"
        transform="rotate(90, 2.0, 55.0)" class="label_small"></text>
  </g>

  <!-- Right side action buttons (text runs vertically along right edge) -->
  <g id="right_action_buttons">
    <!-- Top Right Action Button (aligned with rows 2-3, Y ~54.5mm) -->
    <g id="top-right-action">
      <polygon id="top-right-arrow" points="49.53,46.89 51.75,48.39 49.53,49.89" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>
      <text id="top-right-label" x="47.78" y="45.19" text-anchor="start"
          transform="rotate(-90, 49.08, 43.79)" class="label_small">ACTION</text>
    </g>

    <!-- Bottom Right Action Button (aligned with rows 3-4, Y ~69.6mm) -->
    <g id="bottom-right-action">
      <polygon id="bottom-right-arrow" points="49.53,61.63 51.57,63.13 49.53,64.63" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>
      <text id="bottom-right-label" x="50.28" y="66.13" text-anchor="end"
          transform="rotate(-90, 50.48, 66.03)" class="label_small">ACTION</text>
    </g>

    <!-- Right side description (centered vertically between top and bottom action buttons) -->
    <text id="action-desc-right" x="53.6" y="55.0" text-anchor="middle"
        transform="rotate(-90, 53.6, 55.0)" class="label_small"></text>
  </g>

  <!-- BOTTOM ARROWS (for disc controller direction indication) -->
  <!-- Two downward-facing arrows with text label between them -->
  <g id="bottom_arrows">
    <!-- Left arrow -->
    <polygon id="disc-left-arrow" points="16,86.5 17.5,84.5 14.5,84.5" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>

    <!-- Center text label -->
    <text id="bottom-text" x="27.3" y="85.8" text-anchor="middle" class="label_small">DIRECTION</text>

    <!-- Right arrow -->
    <polygon id="disc-right-arrow" points="38.6,86.5 40.1,84.5 37.1,84.5" fill="none" stroke="#000000" stroke-width="0.2" opacity="1"/>
  </g>

</svg>
