<?xml version="1.0" encoding="UTF-8"?>
<svg width="55.6mm" height="90.4mm" viewBox="0 0 55.6 90.4"
     xmlns="http://www.w3.org/2000/svg">

  <title>Intellivision Controller Overlay Template - Rectangular Buttons</title>

  <defs>
    <style>
      .outline { fill: none; stroke: #000000; stroke-width: 0.2; }
      .guide { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.3,0.3; opacity: 0.5; }
      .button { fill: none; stroke: #8B4513; stroke-width: 0.15; opacity: 0.6; }
      .button_center { fill: #8B4513; opacity: 0.4; }
      .label { font-family: Arial, sans-serif; font-size: 2px; fill: #8B4513; }
      .label_small { font-family: Arial, sans-serif; font-size: 1.2px; fill: #666666; }
      .zone { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.4,0.4; opacity: 0.3; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="55.6" height="90.4" fill="#FFFFFF"/>

  <!-- Outer boundary with different top/bottom rounded corners -->
  <!-- Top corners: 2.26mm radius | Bottom corners: 10.0mm radius -->
  <path id="outer_boundary"
        d="M 2.26 0
           L 53.34 0
           Q 55.6 0 55.6 2.26
           L 55.6 80.4
           Q 55.6 90.4 45.6 90.4
           L 10.0 90.4
           Q 0 90.4 0 80.4
           L 0 2.26
           Q 0 0 2.26 0 Z"
        class="outline"/>

  <!-- TITLE BAR AREA -->
  <rect id="title_bar_zone"
        x="2" y="2"
        width="51.6" height="14"
        class="zone"/>

  <!-- TITLE BACKGROUND (optional colored fill matching official overlays) -->
  <rect id="title-background"
        x="4" y="3.5"
        width="47.6" height="9"
        rx="1.5" ry="1.5"
        fill="none"
        opacity="1.0"/>

  <!-- TITLE BORDER (rounded rectangle matching official overlays) -->
  <rect id="title-border"
        x="4" y="3.5"
        width="47.6" height="9"
        rx="1.5" ry="1.5"
        fill="none"
        stroke="#8B4513"
        stroke-width="0.15"
        opacity="0.8"/>

  <text id="title-text" x="27.8" y="10" text-anchor="middle" class="label">TITLE BAR AREA</text>
  <text x="27.8" y="14.5" text-anchor="middle" class="label_small">(Game name, copyright, etc.)</text>

  <!-- HIDDEN OVERLAY AREA (space behind controller frame when inserted) -->
  <rect x="2" y="17.55" width="51.6" height="4.5" fill="#E0E0E0" opacity="0.4"/>

  <!-- TOP WINDOW SEPARATOR LINE (marks top of hidden area) -->
  <line x1="2" y1="17.55" x2="53.6" y2="17.55"
        stroke="#8B4513" stroke-width="0.2" opacity="0.5"/>

  <!-- SEPARATOR LINE (marks bottom of hidden area / 4mm above button grid) -->
  <line x1="2" y1="22.05" x2="53.6" y2="22.05"
        stroke="#8B4513" stroke-width="0.2" opacity="0.5"/>

  <!-- KEYPAD BUTTON GRID (3 columns × 4 rows) - RECTANGULAR BUTTONS -->
  <!-- Positioned to match official overlay measurements: centers at (13.90, 27.80, 41.70) x (21.75, 36.31, 50.68, 66.57) -->
  <g id="keypad_buttons">
    <!-- Row 1: Buttons 1, 2, 3 - Center Y: 31.75mm -->
    <!-- Button 1 -->
    <circle cx="12.90" cy="31.75" r="0.05" class="button_center"/>
    <rect x="7.20" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-1" x="12.90" y="32.5" text-anchor="middle" class="label_small">1</text>

    <!-- Button 2 -->
    <circle cx="26.80" cy="31.75" r="0.05" class="button_center"/>
    <rect x="21.10" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-2" x="26.80" y="32.5" text-anchor="middle" class="label_small">2</text>

    <!-- Button 3 -->
    <circle cx="40.70" cy="31.75" r="0.05" class="button_center"/>
    <rect x="35.00" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-3" x="40.70" y="32.5" text-anchor="middle" class="label_small">3</text>

    <!-- Row 2: Buttons 4, 5, 6 - Center Y: 46.89mm -->
    <!-- Button 4 -->
    <circle cx="12.90" cy="46.89" r="0.05" class="button_center"/>
    <rect x="7.20" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-4" x="12.90" y="47.7" text-anchor="middle" class="label_small">4</text>

    <!-- Button 5 -->
    <circle cx="26.80" cy="46.89" r="0.05" class="button_center"/>
    <rect x="21.10" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-5" x="26.80" y="47.7" text-anchor="middle" class="label_small">5</text>

    <!-- Button 6 -->
    <circle cx="40.70" cy="46.89" r="0.05" class="button_center"/>
    <rect x="35.00" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-6" x="40.70" y="47.7" text-anchor="middle" class="label_small">6</text>

    <!-- Row 3: Buttons 7, 8, 9 - Center Y: 62.03mm -->
    <!-- Button 7 -->
    <circle cx="12.90" cy="62.03" r="0.05" class="button_center"/>
    <rect x="7.20" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-7" x="12.90" y="62.8" text-anchor="middle" class="label_small">7</text>

    <!-- Button 8 -->
    <circle cx="26.80" cy="62.03" r="0.05" class="button_center"/>
    <rect x="21.10" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-8" x="26.80" y="62.8" text-anchor="middle" class="label_small">8</text>

    <!-- Button 9 -->
    <circle cx="40.70" cy="62.03" r="0.05" class="button_center"/>
    <rect x="35.00" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-9" x="40.70" y="62.8" text-anchor="middle" class="label_small">9</text>

    <!-- Row 4: CLEAR, 0, ENTER - Center Y: 77.18mm -->
    <!-- Button CLEAR -->
    <circle cx="12.90" cy="77.18" r="0.05" class="button_center"/>
    <rect x="7.20" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-clear" x="12.90" y="78.0" text-anchor="middle" class="label_small">CLR</text>

    <!-- Button 0 -->
    <circle cx="26.80" cy="77.18" r="0.05" class="button_center"/>
    <rect x="21.10" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-0" x="26.80" y="78.0" text-anchor="middle" class="label_small">0</text>

    <!-- Button ENTER -->
    <circle cx="40.70" cy="77.18" r="0.05" class="button_center"/>
    <rect x="35.00" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-enter" x="40.70" y="78.0" text-anchor="middle" class="label_small">ENT</text>
  </g>

  <!-- Grid information -->
  <g id="grid_info" opacity="0.5">
    <text x="27.8" y="1.5" text-anchor="middle" class="label_small">
      Expanded Layout: 11.4mm buttons | Spacing: 16.8mm (H) × 15mm (V) | Starts at 24.8mm from top
    </text>
  </g>

  <!-- SIDE ACTION BUTTONS -->
  <!-- Left side action buttons (text runs vertically along left edge) -->
  <g id="left_action_buttons">
    <!-- Top Left Action Button (aligned with rows 1-2, Y ~39mm) -->
    <g id="top-left-action">
      <polygon id="top-left-arrow" points="3.5,38 2,39.25 3.5,40.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <!-- Rotated text label (positioned to the right of arrow) -->
      <text id="top-left-label" x="5" y="39.25" text-anchor="middle"
            transform="rotate(-90, 5, 39.25)" class="label_small">FIRE</text>
    </g>

    <!-- Bottom Left Action Button (aligned with rows 3-4, Y ~69.5mm) -->
    <g id="bottom-left-action">
      <polygon id="bottom-left-arrow" points="3.5,68.5 2,69.75 3.5,71" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <!-- Rotated text label (positioned to the right of arrow) -->
      <text id="bottom-left-label" x="5" y="69.75" text-anchor="middle"
            transform="rotate(-90, 5, 69.75)" class="label_small">FIRE</text>
    </g>
  </g>

  <!-- Right side action buttons (text runs vertically along right edge) -->
  <g id="right_action_buttons">
    <!-- Top Right Action Button (aligned with rows 1-2, Y ~39mm) -->
    <g id="top-right-action">
      <polygon id="top-right-arrow" points="52.1,38 53.6,39.25 52.1,40.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <!-- Rotated text label (positioned to the left of arrow) -->
      <text id="top-right-label" x="50.6" y="39.25" text-anchor="middle"
            transform="rotate(90, 50.6, 39.25)" class="label_small">FIRE</text>
    </g>

    <!-- Bottom Right Action Button (aligned with rows 3-4, Y ~69.5mm) -->
    <g id="bottom-right-action">
      <polygon id="bottom-right-arrow" points="52.1,68.5 53.6,69.75 52.1,71" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <!-- Rotated text label (positioned to the left of arrow) -->
      <text id="bottom-right-label" x="50.6" y="69.75" text-anchor="middle"
            transform="rotate(90, 50.6, 69.75)" class="label_small">FIRE</text>
    </g>
  </g>

  <!-- BOTTOM ARROWS (for disc controller direction indication) -->
  <!-- Two downward-facing arrows with text label between them -->
  <g id="bottom_arrows">
    <!-- Left arrow -->
    <polygon id="disc-left-arrow" points="18,87 19.5,85.5 16.5,85.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>

    <!-- Center text label -->
    <text id="bottom-text" x="27.8" y="87.5" text-anchor="middle" class="label_small">DIRECTION</text>

    <!-- Right arrow -->
    <polygon id="disc-right-arrow" points="37.6,87 39.1,85.5 36.1,85.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
  </g>

</svg>
