<?xml version="1.0" encoding="UTF-8"?>
<svg width="55.6mm" height="90.4mm" viewBox="0 0 55.6 90.4"
     xmlns="http://www.w3.org/2000/svg">

  <title>Intellivision Controller Overlay Template - Rectangular Buttons</title>

  <defs>
    <style>
      .outline { fill: none; stroke: #000000; stroke-width: 0.2; }
      .guide { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.3,0.3; opacity: 0.5; }
      .button { fill: none; stroke: #8B4513; stroke-width: 0.15; opacity: 0.6; }
      .button_center { fill: #8B4513; opacity: 0.4; }
      .label { font-family: Arial, sans-serif; font-size: 2px; fill: #8B4513; }
      .label_small { font-family: Arial, sans-serif; font-size: 1.2px; fill: #666666; }
      .zone { fill: none; stroke: #8B4513; stroke-width: 0.1; stroke-dasharray: 0.4,0.4; opacity: 0.3; }
      .copyright { font-family: Arial Black, sans-serif; font-size: 2px; fill: #333333; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="55.6" height="90.4" fill="#FFFFFF"/>

  <!-- Outer boundary with different top/bottom rounded corners -->
  <!-- Top corners: 2.26mm radius | Bottom corners: 10.0mm radius -->
  <path id="outer_boundary"
        d="M 2.26 0
           L 53.34 0
           Q 55.6 0 55.6 2.26
           L 55.6 80.4
           Q 55.6 90.4 45.6 90.4
           L 10.0 90.4
           Q 0 90.4 0 80.4
           L 0 2.26
           Q 0 0 2.26 0 Z"
        class="outline"/>

  <!-- TITLE BAR AREA -->
  <rect id="title_bar_zone"
        x="2" y="2"
        width="51.6" height="16"
        class="zone"/>

  <!-- TITLE BACKGROUND (optional colored fill matching official overlays) -->
  <rect id="title-background"
        x="4" y="2.5"
        width="47.6" height="10.5"
        rx="1.5" ry="1.5"
        fill="none"
        opacity="1.0"/>

  <!-- TITLE BORDER (rounded rectangle matching official overlays) -->
  <rect id="title-border"
        x="4" y="2.5"
        width="47.6" height="10.5"
        rx="1.5" ry="1.5"
        fill="none"
        stroke="#8B4513"
        stroke-width="0.15"
        opacity="0.8"/>

  <text id="title-text" x="27.8" y="8.5" text-anchor="middle" class="label">TITLE SPACE</text>
  <text id="copyright-text" x="27.8" y="19.5" text-anchor="middle" class="copyright">© Copyright Year &amp; Printing Info.</text>

  <!-- KEYPAD BUTTON GRID (3 columns × 4 rows) - RECTANGULAR BUTTONS -->
  <!-- Positioned to match official overlay measurements: centers at (13.90, 27.80, 41.70) x (21.75, 36.31, 50.68, 66.57) -->
  <g id="keypad_buttons">
    <!-- Row 1: Buttons 1, 2, 3 - Center Y: 31.75mm -->
    <!-- Button 1 -->
    <circle cx="12.90" cy="31.75" r="0.05" class="button_center"/>
    <rect x="7.20" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-1" x="12.90" y="32.25" text-anchor="middle" class="label_small">1</text>

    <!-- Button 2 -->
    <circle cx="26.80" cy="31.75" r="0.05" class="button_center"/>
    <rect x="21.10" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-2" x="26.80" y="32.25" text-anchor="middle" class="label_small">2</text>

    <!-- Button 3 -->
    <circle cx="40.70" cy="31.75" r="0.05" class="button_center"/>
    <rect x="35.00" y="26.05" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-3" x="40.70" y="32.25" text-anchor="middle" class="label_small">3</text>

    <!-- Row 2: Buttons 4, 5, 6 - Center Y: 46.89mm -->
    <!-- Button 4 -->
    <circle cx="12.90" cy="46.89" r="0.05" class="button_center"/>
    <rect x="7.20" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-4" x="12.90" y="47.39" text-anchor="middle" class="label_small">4</text>

    <!-- Button 5 -->
    <circle cx="26.80" cy="46.89" r="0.05" class="button_center"/>
    <rect x="21.10" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-5" x="26.80" y="47.39" text-anchor="middle" class="label_small">5</text>

    <!-- Button 6 -->
    <circle cx="40.70" cy="46.89" r="0.05" class="button_center"/>
    <rect x="35.00" y="41.19" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-6" x="40.70" y="47.39" text-anchor="middle" class="label_small">6</text>

    <!-- Row 3: Buttons 7, 8, 9 - Center Y: 62.03mm -->
    <!-- Button 7 -->
    <circle cx="12.90" cy="62.03" r="0.05" class="button_center"/>
    <rect x="7.20" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-7" x="12.90" y="62.53" text-anchor="middle" class="label_small">7</text>

    <!-- Button 8 -->
    <circle cx="26.80" cy="62.03" r="0.05" class="button_center"/>
    <rect x="21.10" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-8" x="26.80" y="62.53" text-anchor="middle" class="label_small">8</text>

    <!-- Button 9 -->
    <circle cx="40.70" cy="62.03" r="0.05" class="button_center"/>
    <rect x="35.00" y="56.33" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-9" x="40.70" y="62.53" text-anchor="middle" class="label_small">9</text>

    <!-- Row 4: CLEAR, 0, ENTER - Center Y: 77.18mm -->
    <!-- Button CLEAR -->
    <circle cx="12.90" cy="77.18" r="0.05" class="button_center"/>
    <rect x="7.20" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-clear" x="12.90" y="77.68" text-anchor="middle" class="label_small">CLR</text>

    <!-- Button 0 -->
    <circle cx="26.80" cy="77.18" r="0.05" class="button_center"/>
    <rect x="21.10" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-0" x="26.80" y="77.68" text-anchor="middle" class="label_small">0</text>

    <!-- Button ENTER -->
    <circle cx="40.70" cy="77.18" r="0.05" class="button_center"/>
    <rect x="35.00" y="71.48" width="11.4" height="11.4" rx="1.5" ry="1.5" class="button"/>
    <text id="btn-enter" x="40.70" y="77.68" text-anchor="middle" class="label_small">ENT</text>
  </g>

  <!-- Grid information -->
  <g id="grid_info" opacity="0.5">
    <text x="27.8" y="1.5" text-anchor="middle" class="label_small">
      Expanded Layout: 11.4mm buttons | Spacing: 16.8mm (H) × 15mm (V) | Starts at 24.8mm from top
    </text>
  </g>

  <!-- SIDE ACTION BUTTONS -->
  <!-- Left side action buttons (text runs vertically along left edge) -->
  <g id="left_action_buttons">
    <!-- Top Left Action Button (aligned with rows 2-3, Y ~54.5mm) -->
    <g id="top-left-action">
      <polygon id="top-left-arrow" points="5.12,46.89 3.08,48.39 5.12,49.89" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <text id="top-left-label" x="4.0" y="44.89" text-anchor="end"
          transform="rotate(90, 4.0, 44.89)" class="label_small">ACTION</text>
    </g>

    <!-- Bottom Left Action Button (aligned with rows 3-4, Y ~69.6mm) -->
    <g id="bottom-left-action">
      <polygon id="bottom-left-arrow" points="5.12,62.03 3.08,63.53 5.12,65.03" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <text id="bottom-left-label" x="4.0" y="66.03" text-anchor="start"
          transform="rotate(90, 4.0, 66.03)" class="label_small">ACTION</text>
    </g>
  </g>

  <!-- Right side action buttons (text runs vertically along right edge) -->
  <g id="right_action_buttons">
    <!-- Top Right Action Button (aligned with rows 2-3, Y ~54.5mm) -->
    <g id="top-right-action">
      <polygon id="top-right-arrow" points="48.93,46.89 51.15,48.39 48.93,49.89" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <text id="top-right-label" x="50.48" y="44.89" text-anchor="start"
          transform="rotate(-90, 50.48, 44.89)" class="label_small">ACTION</text>
    </g>

    <!-- Bottom Right Action Button (aligned with rows 3-4, Y ~69.6mm) -->
    <g id="bottom-right-action">
      <polygon id="bottom-right-arrow" points="48.93,62.03 50.97,63.53 48.93,65.03" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
      <text id="bottom-right-label" x="50.48" y="66.03" text-anchor="end"
          transform="rotate(-90, 50.48, 66.03)" class="label_small">ACTION</text>
    </g>
  </g>

  <!-- BOTTOM ARROWS (for disc controller direction indication) -->
  <!-- Two downward-facing arrows with text label between them -->
  <g id="bottom_arrows">
    <!-- Left arrow -->
    <polygon id="disc-left-arrow" points="15.5,87 17,85.5 14,85.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>

    <!-- Center text label -->
    <text id="bottom-text" x="26.8" y="87" text-anchor="middle" class="label_small">DIRECTION</text>

    <!-- Right arrow -->
    <polygon id="disc-right-arrow" points="38.1,87 39.6,85.5 36.6,85.5" fill="none" stroke="#8B4513" stroke-width="0.2" opacity="0.6"/>
  </g>

</svg>
