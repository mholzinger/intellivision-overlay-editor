<?xml version="1.0" encoding="UTF-8"?>
<!--
  Intellivision Box Art Template
  Dimensions: 186mm x 256mm (matching original box proportions)

  Structure (outside to inside):
  1. Outer border (white in originals)
  2. Header bar with branding
  3. Content frame (rounded rectangle)
  4. Game title area
  5. Artwork area (full frame)
  6. Vignette frame (optional oval - hidden by default)
  7. Optional badges
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 186 256"
     width="186mm"
     height="256mm">

  <defs>
    <!-- Embed SF Intellivised font -->
    <style type="text/css">
      @font-face {
        font-family: 'SF Intellivised';
        src: url('/fonts/SF Intellivised.ttf') format('truetype');
      }
    </style>

    <!-- Clip path for content inside rounded frame -->
    <clipPath id="content-frame-clip">
      <rect x="10" y="20" width="166" height="206" rx="4" ry="4"/>
    </clipPath>

    <!-- Clip path for artwork inside the vignette frame (when enabled) -->
    <!-- Sized to align with inner edge of vignette stroke (rx - strokeWidth/2) -->
    <clipPath id="vignette-clip">
      <ellipse id="vignette-clip-shape" cx="93" cy="136" rx="64" ry="64"/>
    </clipPath>
  </defs>

  <!-- ============================================ -->
  <!-- LAYER 1: BACKGROUND / BORDER FILL            -->
  <!-- ============================================ -->
  <g id="background-layer">
    <!-- Background fill (Intellivision blue) - visible in border/margin areas -->
    <rect id="box-background"
          x="0" y="0"
          width="186" height="256"
          fill="#1E3A8A"/>
    <!-- Outer border stroke -->
    <rect id="box-outer-border"
          x="0" y="0"
          width="186" height="256"
          fill="none"
          stroke="#999999"
          stroke-width="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 2: CONTENT FRAME                       -->
  <!-- ============================================ -->
  <g id="content-frame-layer">
    <!-- Content frame (rounded rectangle) - white fill covers blue background -->
    <rect id="content-frame"
          x="10" y="20"
          width="166" height="206"
          fill="#FFFFFF"
          stroke="none"
          rx="4" ry="4"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 3: ARTWORK PLACEHOLDERS                -->
  <!-- ============================================ -->
  <g id="artwork-layer">
    <!-- Background artwork placeholder - matches content frame boundaries -->
    <rect id="background-artwork-placeholder"
          x="10" y="56"
          width="166" height="170"
          fill="none"
          stroke="#cccccc"
          stroke-width="0.5"
          stroke-dasharray="4,2"/>

    <!-- Center crosshair for artwork alignment (centered in full content frame) -->
    <line x1="93" y1="56" x2="93" y2="226" stroke="#cccccc" stroke-width="0.25"/>
    <line x1="10" y1="141" x2="176" y2="141" stroke="#cccccc" stroke-width="0.25"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 4: FRAME STRIPES                       -->
  <!-- Decorative border stripes around content     -->
  <!-- Structure (outside to inside):               -->
  <!--   - Thin separator line                      -->
  <!--   - Stripe 1 (outer)                         -->
  <!--   - Thin separator line                      -->
  <!--   - Stripe 2 (middle) - only in 3-stripe    -->
  <!--   - Thin separator line                      -->
  <!--   - Stripe 3 (inner) - only in 3-stripe     -->
  <!--   - Thin separator line                      -->
  <!-- ============================================ -->
  <g id="frame-stripes-layer">
    <!-- Stripes will be dynamically generated here by JavaScript -->
    <!-- Default: 1 stripe with thin lines on either side -->
  </g>

  <!-- ============================================ -->
  <!-- LAYER 5: BRANDING (top header area)          -->
  <!-- ============================================ -->
  <g id="branding-layer">
    <!-- Brand logo -->
    <text id="brand-logo"
          x="12" y="13"
          font-family="'SF Intellivised', sans-serif"
          font-size="12"
          fill="#FFFFFF">Intellivision</text>

    <!-- Tagline -->
    <text id="brand-tagline"
          x="118" y="13"
          font-family="sans-serif"
          font-size="5"
          fill="#FFFFFF">Intelligent Television</text>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 6: VIGNETTE FRAME (optional)           -->
  <!-- Hidden by default - enable via editor        -->
  <!-- Default is circle (rx=ry), can be adjusted   -->
  <!-- Clipped to content frame boundary            -->
  <!-- ============================================ -->
  <g id="vignette-layer" style="display: none;" clip-path="url(#content-frame-clip)">
    <!-- Vignette artwork placeholder (inserted here when uploaded) -->

    <!-- Outer vignette ring (decorative border) -->
    <ellipse id="vignette-outer"
             cx="93" cy="136"
             rx="65" ry="65"
             fill="none"
             stroke="#666666"
             stroke-width="2"/>

    <!-- Inner vignette ring (optional second circle, hidden by default) -->
    <ellipse id="vignette-inner"
             cx="93" cy="136"
             rx="62" ry="62"
             fill="none"
             stroke="#999999"
             stroke-width="1"
             style="display: none;"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 7: TITLE AREA (renders on top)         -->
  <!-- ============================================ -->
  <g id="title-layer">
    <!-- Title area boundary - aligned with content frame -->
    <rect id="title-area"
          x="10" y="20"
          width="166" height="36"
          fill="none"
          stroke="#cccccc"
          stroke-width="0.5"
          stroke-dasharray="2,2"/>

    <!-- Game title placeholder -->
    <text id="game-title"
          x="93" y="36"
          font-family="Arial, sans-serif"
          font-size="14"
          fill="#333333"
          text-anchor="middle">GAME TITLE</text>

    <!-- Subtitle placeholder -->
    <text id="game-subtitle"
          x="93" y="48"
          font-family="Arial, sans-serif"
          font-size="4"
          fill="#666666"
          text-anchor="middle">by MATTEL ELECTRONICS</text>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 8: BADGE AREAS (optional)              -->
  <!-- ============================================ -->
  <g id="badge-layer">
    <!-- Voice badge area (speech bubble) -->
    <rect id="voice-badge-area"
          x="70" y="20"
          width="46" height="35"
          fill="none"
          stroke="#cccccc"
          stroke-width="0.25"
          stroke-dasharray="2,2"
          style="display: none;"/>

    <!-- Player count badge area -->
    <rect id="player-badge-area"
          x="50" y="200"
          width="86" height="12"
          fill="none"
          stroke="#cccccc"
          stroke-width="0.25"
          stroke-dasharray="2,2"
          style="display: none;"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 9: BOTTOM MARGIN                       -->
  <!-- (colored border area around content frame,   -->
  <!--  matching original box art design)           -->
  <!-- ============================================ -->
  <!-- Note: Content frame ends at y=248 (38+210), leaving 8mm bottom margin
       to match the 8mm side margins (content at x=8, width=170, ends at x=178) -->

</svg>
